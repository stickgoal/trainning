version: '3.8'

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: rag-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    environment:
      - REDIS_ARGS=--requirepass abc123 --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "abc123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
