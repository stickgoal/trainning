[project]
name = "taskflow"
version = "0.1.0"
description = "FastAPI 教学项目：团队协作任务 API"
readme = "README.md"
requires-python = ">=3.11"

# 运行时依赖：只列"直接用到的"，传递依赖交给 uv.lock / pip 解析
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "loguru>=0.7",
    "python-multipart>=0.0.9",   # 文件上传（multipart/form-data）需要
]

# 开发依赖：测试与代码质量（生产镜像不装）
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src 布局：告诉构建后端包在 src/ 下
[tool.hatch.build.targets.wheel]
packages = ["src/taskflow"]

[tool.pytest.ini_options]
# 关键：让 pytest 能直接 import taskflow，无需先 pip install -e .
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
