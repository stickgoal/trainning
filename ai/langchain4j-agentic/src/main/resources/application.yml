server:
  port: 9050

spring:
  application:
    name: langchain4j-agentic-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agentic_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: input
      table-prefix: ""

langchain4j:
  open-ai:
    chat-model:
      api-key: sk-JPIHxsZKulPYjtoQlFff4ZXtVpl15wYtcMgqiven7XqB9Avh
      base-url: https://apihub.agnes-ai.com/v1
      model-name: agnes-2.0-flash
      temperature: 0.7
      log-requests: true
      log-responses: true

logging:
  level:
    root: INFO
    dev.langchain4j: DEBUG
    com.example.agentic: DEBUG
